name: Deploy privacy policy (manual only)
# PR-LAUNCH-1 LEGAL-BRANCH 2026-10-20: the live site is served from the gh-pages
# branch (legacy Pages build). Push-to-main deploys are disabled so main can't
# overwrite gh-pages-only pages (email-confirmed, password-reset, support).
# Do not run this by hand until main and gh-pages are reconciled.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
