<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your PocketRounds password</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5; max-width: 28rem; margin: 0 auto; padding: 2rem 1.25rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
    p, label { margin: 0 0 0.75rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.65rem 0.7rem; font-size: 1rem; border-radius: 8px; border: 1px solid #ccc; }
    button { margin-top: 0.5rem; width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px; background: #0a84ff; color: #fff; }
    button:disabled { opacity: 0.5; }
    .err { color: #c00; font-weight: 600; }
    .ok { color: #0a7; font-weight: 600; }
    .meta { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Reset your PocketRounds password</h1>
  <p class="meta">This is PocketRounds. It is not the staff Ops site.</p>
  <div id="msg"></div>
  <form id="form" hidden>
    <label for="pw">New password (6+ characters)</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="6" required />
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="6" required />
    <button type="submit" id="go">Save password</button>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ffgjmqqxldaubfgpnpxm.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZ2ptcXF4bGRhdWJmZ3BucHhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxODI1MDAsImV4cCI6MjA5OTc1ODUwMH0._N_daZ46CKNQmMqB988wa45u5q3BtI80TRYMHQ05hPs';
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');
    function show(text, cls) { msg.innerHTML = '<p class="' + cls + '">' + text + '</p>'; }
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    async function boot() {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      const query = new URLSearchParams(location.search);
      const access = hash.get('access_token');
      const refresh = hash.get('refresh_token');
      const type = hash.get('type') || query.get('type');
      const tokenHash = query.get('token_hash') || hash.get('token_hash');
      try {
        if (access && refresh) {
          const { error } = await client.auth.setSession({ access_token: access, refresh_token: refresh });
          if (error) throw error;
        } else if (tokenHash) {
          const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type: type || 'recovery' });
          if (error) throw error;
        } else {
          show('This reset link is missing or expired. Open PocketRounds, tap Forgot password or check this email, and use the newest mail.', 'err');
          return;
        }
        form.hidden = false;
        show('Choose a new PocketRounds password, then return to the app and Sign in with email.', 'ok');
      } catch (e) {
        show((e && e.message) ? e.message : 'Could not open this reset link. Request a new one from the app.', 'err');
      }
    }
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const a = document.getElementById('pw').value;
      const b = document.getElementById('pw2').value;
      if (a.length < 6) { show('Password must be at least 6 characters.', 'err'); return; }
      if (a !== b) { show('Passwords do not match.', 'err'); return; }
      document.getElementById('go').disabled = true;
      const { error } = await client.auth.updateUser({ password: a });
      document.getElementById('go').disabled = false;
      if (error) { show(error.message, 'err'); return; }
      form.hidden = true;
      show('Password saved. Return to PocketRounds and tap Sign in with email.', 'ok');
    });
    boot();
  </script>
</body>
</html>
